<!DOCTYPE html>

          { name: "Leche semidescremada", amount: "300ml" },

                <div className="inline-flex items-center gap-2 rounded-full bg-white border border-[#e8ebe6] px-4 py-2 text-[13px]">

                Cantidades en crudo. Pesar antes de cocinar. Aceite medido con cucharilla.

            {/* COMIDAS */}

              <div className="hidden md:block rounded-[16px] border border-[#e8ebe6] overflow-hidden bg-white">

                          <td className="py-4 px-5 align-top">

                          </td>

                        <td className="py-4 px-5 text-right font-semibold text-[13px]">~2986</td>
                      </tr>
                    </tbody>

                </div>
              </div>

              {/* Vista Móvil / Acordeón */}
              <div className="md:hidden flex flex-col gap-3">
                {meals.map((meal) => {
                  const isOpen = openMeal === meal.id;
                  return (
                    <div key={meal.id} className="rounded-[14px] border border-[#e8ebe6] bg-white overflow-hidden">
                      <button 
                        onClick={() => setOpenMeal(isOpen ? null : meal.id)}
                        className="w-full flex items-center justify-between px-4 py-3.5 text-left"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-9 h-9 rounded-full bg-[#f2f4f0] flex items-center justify-center text-[11px] font-semibold text-[#0f2a1d]">

                          <div>
                            <div className="text-[13px] font-semibold leading-tight">{meal.label}</div>

                        <div className="flex items-center gap-3">

                                <span className="font-mono text-[12px] text-black/60 text-right">{food.amount}</span>
                              </React.Fragment>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                  <div className="flex items-center gap-4 text-[13px]">
                    <span className="font-semibold">186–198g proteína</span>
                    <span className="opacity-80">~2986 kcal</span>
                  </div>
                </div>
              </div>

                    <span className="ml-auto text-[10px] px-2 py-1 rounded-full bg-[#f5f5f2] text-black/40 uppercase tracking-widest">Frescos</span>
                  </div>
                  <ul className="space-y-2.5 text-[13px] leading-[1.4]">
                    {[
                      { name: "Pechuga pollo", qty: "1,4kg", note: "fileteada" },
                      { name: "Huevos L", qty: "24 uds", note: "2 maples" },
                      { name: "Leche semidescremada", qty: "6L", note: "" },
                      { name: "Arroz redondo / largo", qty: "1kg", note: "" },
                      { name: "Pan integral", qty: "500g", note: "molde" },
                      { name: "Ensalada bolsa", qty: "3 bolsas", note: "100g x toma" },
                      { name: "Verdura congelada", qty: "1kg", note: "mezcla" },
                      { name: "Miel", qty: "1 bote", note: "" }

                          <span className="w-[18px] h-[18px] rounded-[5px] border border-[#d9ddd6] flex-shrink-0 mt-0.5"></span>

                {/* Lidl */}

                          <span className="text-[#1a2b1f]">{item.name}</span>

                  <div className="mt-5 pt-4 border-t border-[#f0f1ee] flex items-start gap-2">
                    <div className="w-4 h-4 rounded-full bg-[#0f2a1d] text-white flex items-center justify-center text-[8px] mt-0.5">i</div>
                    <p className="text-[11px] leading-[1.5] text-black/50">
                      Whey: si no tienes, compra en tienda deportiva. 30g por toma merienda.
                    </p>
                  </div>
                </div>
              </div>
            </section>

            {/* BATCH COOKING */}
            <section className="mt-10">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-[28px] h-[28px] rounded-full bg-[#0f2a1d] text-white flex items-center justify-center text-[12px] font-semibold">4</div>

                    <ul className="space-y-2 text-[13px] leading-[1.5] text-[#1a2b1f]">
                      <li className="flex gap-2"><span className="text-black/20">—</span> Cocer 600g arroz en crudo (olla grande, 15 min)</li>
                      <li className="flex gap-2"><span className="text-black/20">—</span> Plancha 1kg pechuga pollo con 10ml aceite</li>
                      <li className="flex gap-2"><span className="text-black/20">—</span> Saltear 600g carne picada 5%</li>
                      <li className="flex gap-2"><span className="text-black/20">—</span> Asar 6 patatas medianas horno 200º / micro 12 min</li>
                    </ul>
                    <div className="mt-4 inline-flex items-center gap-2 rounded-full bg-white border border-[#e8ebe6] px-3 py-1.5 text-[11px]">
                      <span className="w-2 h-2 rounded-full bg-[#0f2a1d]"></span>

                      <li className="flex gap-2"><span className="text-black/20">—</span> Repetir mismo bloque completo</li>

                      <li className="flex gap-2"><span className="text-black/20">—</span> Lavar ensalada bolsa al momento, no antes</li>
                    </ul>
                    <div className="mt-4 flex gap-2">
                      <span className="inline-flex items-center gap-1.5 rounded-full bg-[#f5f5f2] px-3 py-1.5 text-[11px] text-black/60">
                        <span className="w-1 h-1 rounded-full bg-black/30"></span> Avena y leche en el momento
                      </span>
                    </div>
                  </div>
                </div>
                <div className="bg-[#0f2a1d] text-white/70 px-5 py-3 flex flex-wrap items-center gap-x-6 gap-y-2 text-[11px]">
                  <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full border border-white/20 flex items-center justify-center text-[8px]">✓</span> Tuppers cristal 750ml</span>

                </div>
              </div>

              <span>Dieta base · cantidades en crudo</span>
              <span className="font-mono">3000 kcal · 4 tomas</span>
            </footer>
          </main>

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
